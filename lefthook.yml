pre-commit:
  parallel: true
  commands:
    no-commit-to-main:
      run: |
        branch=$(git rev-parse --abbrev-ref HEAD)
        if [ "$branch" = "main" ] || [ "$branch" = "master" ]; then
          echo "Direct commits to $branch are not allowed. Create a feature branch."
          exit 1
        fi
    lint:
      run: bun run lint
    typecheck:
      run: bun run typecheck
    test:
      run: bun run test

pre-push:
  parallel: true
  commands:
    lint:
      run: bun run lint
    typecheck:
      run: bun run typecheck
    build:
      run: bun run build
    test:
      run: bun test --coverage
